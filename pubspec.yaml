name: idioms_quiz
description: "四字熟語クイズアプリ — 100の四字熟語を学べるFlutterアプリ。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/idioms.json
    - assets/audio/
    - assets/images/

  fonts:
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansJP-ExtraBold.ttf
          weight: 800
    - family: Noto Serif JP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifJP-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerifJP-ExtraBold.ttf
          weight: 800
