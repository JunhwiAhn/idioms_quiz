name: idioms_quiz
description: "DELE Voca Dojo - Spanish vocabulary quiz app for DELE prep (A1-B1)."
publish_to: 'none'
version: 1.0.7+13

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.5
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FAF6F2"
  adaptive_icon_foreground: "assets/images/home_brand_icon.png"
  adaptive_icon_foreground_inset: 24
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FAF6F2"
    theme_color: "#B03A2E"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/dele_a1_a2_b1_problem_bank.enriched.json
    - assets/audio/
    - assets/images/

  fonts:
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-VF.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansJP-ExtraBold.ttf
          weight: 800
    - family: Noto Serif JP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifJP-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerifJP-ExtraBold.ttf
          weight: 800
